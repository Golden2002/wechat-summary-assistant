<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="markdown-to-pdf">
<meta name="dcterms.created" content="{{DATE}}">
<title>{{TITLE}}</title>
<!-- 同目录相对路径：file:// 打开时可用。全部字体来自系统，无任何网络请求。 -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ══════════════════════════ 封面 ══════════════════════════
     加 .cover-bleed 表示渲染器支持 @page :first 全出血（Chromium 支持）。
     若去掉该类，色带会收在版心内，仍是完整可用的扉页。 -->
<section class="cover cover-bleed" id="cover">
  <div class="cover-inner">

    <p class="cover-kicker">{{PROJECT}}</p>

    <h1 class="cover-title">{{TITLE}}</h1>

    <p class="cover-subtitle">{{SUBTITLE}}</p>

    <!-- 内容提要：由生成器的 --cover-guide 提供；没有提供时这里是一段空串，
         样式表里的 .cover-guide:empty 会整块收掉，封面退回简版。 -->
    {{COVER_GUIDE}}

    <dl class="cover-meta">
      <div>
        <dt>版本 / Version</dt>
        <dd>{{VERSION}}</dd>
      </div>
      <div>
        <dt>日期 / Date</dt>
        <dd>{{DATE}}</dd>
      </div>
      <div>
        <dt>项目 / Project</dt>
        <dd><code>{{PROJECT}}</code></dd>
      </div>
    </dl>

    <div class="cover-foot">
      <span>技术规格说明书</span>
      <span>本文档由 Markdown 自动排版生成</span>
    </div>

  </div>
</section>

<!-- ══════════════════════════ 目录 ══════════════════════════
     生成器产出完整的 <nav class="toc">…</nav>，层级类挂在 <li> 上：
       <nav class="toc">
         <h2 class="toc-title">目录</h2>
         <ol class="toc-list">
           <li class="toc-l1"><a href="#c1"><span class="toc-num">1</span>
               <span class="toc-text">总体设计</span></a>
             <ol class="toc-sub">
               <li class="toc-l2"><a href="#c1-1"><span class="toc-num"></span>
                   <span class="toc-text">目标</span></a></li>
             </ol>
           </li>
         </ol>
       </nav>
     样式表里对应的选择器是 .toc-l1 > a（不是 .toc-l1 > li > a）；
     没有页码，因此目录里不画任何引导线。 -->
{{TOC}}

<!-- ══════════════════════════ 正文 ══════════════════════════ -->
<main class="content">
{{CONTENT}}
</main>

</body>
</html>
